<!doctype html>
<meta charset="utf-8">
<title>opslify cockpit</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/cockpit.css">
<body>

<div class="root">

  <!-- The header states, permanently: where you are, and who is driving. Neither
       is a thing an operator should have to go and look for. -->
  <div class="hdr">
    <h1>opslify</h1>
    <span class="tag">cockpit</span>
    <span class="rule"></span>
    <span id="crumbs"></span>
    <span class="spacer"></span>
    <span id="agentpill" class="agentpill none">
      <span class="dot off"></span>
      <span class="nm">no agent bound</span>
      <span class="ch"></span>
    </span>
    <span id="tracebadge" class="badge">trace —</span>
  </div>

  <div class="body" id="body">

    <!-- project rail -->
    <div class="rail" id="rail"></div>

    <!-- scope sidebar -->
    <div class="side" id="side"></div>

    <!-- tabbed work area -->
    <div class="center">
      <div class="tabs" id="tabs"></div>
      <div class="work" id="work"></div>
      <div class="drawer" id="drawer">
        <div class="dtabs" id="dtabs"></div>
        <div class="tl" id="trace"></div>
      </div>
    </div>

    <!-- agent panel -->
    <div class="chat" id="chat"></div>

  </div>
</div>

<div id="overlay"></div>
<div class="toast" id="toast"></div>

<script src="/cockpit.js"></script>
</body>
