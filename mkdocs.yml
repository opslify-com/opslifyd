site_name: opslifyd
site_description: >-
  opslifyd — the open-source, self-hosted control plane that runs AI-agent DevOps
  commands inside hardened, per-session sandboxes, with a credential-blind secret
  broker, policy + human approval, and a tamper-evident audit trail.
site_url: https://opslify-com.github.io/opslifyd/
repo_url: https://github.com/opslify-com/opslifyd
repo_name: opslify-com/opslifyd
edit_uri: edit/main/docs/
copyright: Copyright &copy; opslify

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/overview.md
      - Requirements: getting-started/requirements.md
      - Quickstart: getting-started/quickstart.md
  - Installation:
      - One-line install: install/one-line.md
      - Install script: install/script.md
      - What the installer does: install/what-it-does.md
      - Verify the install: install/verify.md
      - Upgrade: install/upgrade.md
      - Uninstall: install/uninstall.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Sessions & workspaces: concepts/sessions-workspaces.md
      - Credential-blind broker: concepts/credential-broker.md
      - Policy & approvals: concepts/policy.md
      - Audit trail: concepts/audit.md
      - Egress control: concepts/egress.md
  - Guides:
      - Run commands: guides/run-commands.md
      - Workspaces & host sync: guides/workspaces-sync.md
      - The dashboard: guides/dashboard.md
      - Use with AI agents (MCP): guides/ai-agents-mcp.md
      - Credential-blind API access: guides/credential-blind-gitlab.md
      - Install packages: guides/install-packages.md
      - Manage secrets: guides/secrets.md
      - Configure policy: guides/policy-config.md
      - Verify the audit trail: guides/verify-audit.md
  - Reference:
      - CLI: reference/cli.md
      - Configuration: reference/config.md
      - Service management: reference/service.md
      - Troubleshooting: reference/troubleshooting.md
  - Security:
      - Security model: security/model.md
  - About:
      - Roadmap: about/roadmap.md
      - Contributing: about/contributing.md
